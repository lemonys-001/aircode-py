name: Build release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: aircode-py-linux-x86_64
          - os: macos-15-intel
            asset: aircode-py-macos-x86_64
          - os: macos-15
            asset: aircode-py-macos-arm64
          - os: windows-2022
            asset: aircode-py-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[gui]" pyinstaller

      - name: Build binary
        shell: bash
        run: python -m PyInstaller --clean --noconfirm packaging/aircode.spec

      - name: Name release asset
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/aircode-py.exe "${{ matrix.asset }}"
          else
            cp dist/aircode-py "${{ matrix.asset }}"
            chmod +x "${{ matrix.asset }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  build-linux-arm64:
    name: aircode-py-linux-aarch64
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - name: Build under QEMU
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/aircode-out"
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$RUNNER_TEMP/aircode-out:/out" \
            -w /src \
            ubuntu:24.04 bash -lc '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              export PYTHONDONTWRITEBYTECODE=1
              apt-get update
              apt-get install -y --no-install-recommends python3.12 python3.12-venv libpython3.12 ca-certificates binutils
              python3.12 -m venv /venv
              /venv/bin/pip install --upgrade pip
              /venv/bin/pip install --no-cache-dir ".[gui]" pyinstaller
              /venv/bin/python -m PyInstaller --clean --noconfirm \
                --distpath /tmp/dist --workpath /tmp/build packaging/aircode.spec
              cp /tmp/dist/aircode-py /out/aircode-py-linux-aarch64
              chmod +x /out/aircode-py-linux-aarch64
            '
          cp "$RUNNER_TEMP/aircode-out/aircode-py-linux-aarch64" .

      - uses: actions/upload-artifact@v4
        with:
          name: aircode-py-linux-aarch64
          path: aircode-py-linux-aarch64
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, build-linux-arm64]
    if: always() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
