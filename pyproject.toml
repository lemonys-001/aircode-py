[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aircode-py"
version = "0.1.0"
description = "Aircode: an independent Python coding agent with OpenCode Zen login, TUI, native GUI and web UI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "aircode-py contributors" }]
keywords = ["coding-agent", "tui", "opencode", "zen", "llm"]
classifiers = [
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dependencies = [
  "httpx>=0.27",
  "textual>=0.89",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[project.scripts]
aircode = "aircode.cli:main"

[project.urls]
Homepage = "https://github.com/lemonys-001/aircode-py"
Issues = "https://github.com/lemonys-001/aircode-py/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aircode = ["web/dist/**/*", "web/dist/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
